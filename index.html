<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="michael tarekegn — math &amp; ml research, self-attention, physics-informed neural networks." />
<title>michael tarekegn — portfolio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
    transition: opacity 0.3s ease;
  }
  .stage.hidden { opacity: 0; }

  /* ---------- Monitor (greyscale, code on screen) ---------- */
  .monitor {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bezel {
    width: 260px;
    height: 180px;
    background: #fdfdfd;
    border: 2px solid #1a1a1a;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.02) inset;
  }
  .screen {
    width: 100%;
    height: 100%;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.025) 0px,
      rgba(0,0,0,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }
  .code-preview {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    line-height: 1.55;
    color: #999;
    padding: 10px 12px;
    white-space: pre;
  }
  .code-preview .kw { color: #555; }
  .code-preview .fn { color: #333; }
  .code-preview .cursor-blink {
    display: inline-block;
    width: 0.5em;
    background: #666;
    animation: blink 1s step-end infinite;
  }

  .neck {
    width: 28px;
    height: 22px;
    background: #fdfdfd;
    border: 2px solid #1a1a1a;
    border-top: none;
  }
  .stand {
    width: 90px;
    height: 8px;
    background: #fdfdfd;
    border: 2px solid #1a1a1a;
    border-radius: 4px;
    margin-top: -2px;
  }

  /* ---------- Shadow ---------- */
  .shadow {
    width: 170px;
    height: 22px;
    margin-top: -0.5rem;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.08) 55%, rgba(0,0,0,0) 75%);
    animation: shadow-pulse 5s ease-in-out infinite;
    filter: blur(1px);
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scaleX(1); opacity: 0.9; }
    50%      { transform: scaleX(0.9); opacity: 0.75; }
  }

  /* ---------- Enter link ---------- */
  .enter {
    font-family: 'Space Mono', monospace;
    font-size: 1.05rem;
    letter-spacing: 0.15em;
    color: #1a1a1a;
    text-decoration: none;
    text-transform: lowercase;
    border: none;
    background: none;
    cursor: pointer;
    position: relative;
    padding-bottom: 2px;
  }
  .enter::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }
  .enter:hover::after { transform: scaleX(1); }

  .caret {
    display: inline-block;
    width: 0.55em;
    background: #1a1a1a;
    margin-left: 0.15em;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ---------- Flood overlay ---------- */
  .flood-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #fdfdfd;
    opacity: 0;
    pointer-events: none;
    clip-path: circle(0% at var(--ox, 50%) var(--oy, 50%));
    transition: clip-path 1.05s cubic-bezier(0.65,0,0.35,1), opacity 0.25s ease;
  }
  .flood-overlay.active {
    opacity: 1;
    pointer-events: all;
    clip-path: circle(150% at var(--ox, 50%) var(--oy, 50%));
  }
  .flood-code {
    position: absolute;
    inset: 0;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.6;
    color: #999;
    padding: 2rem;
    white-space: pre;
  }
  .flood-code .kw { color: #444; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="monitor">
    <div class="bezel">
      <div class="screen">
        <pre class="code-preview" id="codePreview">const <span class="fn">self</span> = <span class="kw">await</span> load(<span class="kw">"michael"</span>);

<span class="kw">function</span> <span class="fn">build</span>(idea) {
  <span class="kw">return</span> idea
    .sketch()
    .refine()
    .ship();
}

<span class="kw">export default</span> self<span class="cursor-blink">&nbsp;</span></pre>
      </div>
    </div>
    <div class="neck"></div>
    <div class="stand"></div>
  </div>

  <div class="shadow"></div>

  <a class="enter" href="home.html" id="enter-link">[ enter ]<span class="caret">&nbsp;</span></a>
</div>

<div class="flood-overlay" id="floodOverlay">
  <div class="flood-code" id="floodCode"></div>
</div>

<script>
(function() {
  const stage = document.getElementById('stage');
  const link = document.getElementById('enter-link');
  const overlay = document.getElementById('floodOverlay');
  const floodCode = document.getElementById('floodCode');
  const bezel = document.querySelector('.bezel');

  const snippets = [
    'import { self } from "./michael";',
    'const state = useState(curious);',
    'function refine(idea) {',
    '  return idea.iterate();',
    '}',
    'render(<Portfolio />);',
    'export const build = () => {',
    '  ship();',
    '};',
    'if (!done) keepGoing();',
    'const coffee = true;',
    'while (curious) { learn(); }',
    'git commit -m "one more pass"',
    '// still refining this',
    'const design = invisible(good);',
    'connect().then(hello);'
  ];

  let triggered = false;
  link.addEventListener('click', function(e) {
    if (triggered) return;
    triggered = true;
    e.preventDefault();

    const r = bezel.getBoundingClientRect();
    overlay.style.setProperty('--ox', (r.left + r.width / 2) + 'px');
    overlay.style.setProperty('--oy', (r.top + r.height / 2) + 'px');

    stage.classList.add('hidden');
    overlay.classList.add('active');

    let count = 0;
    const maxLines = 90;
    const interval = setInterval(function() {
      const s = snippets[Math.floor(Math.random() * snippets.length)];
      const line = document.createElement('div');
      line.textContent = s;
      floodCode.appendChild(line);
      floodCode.scrollTop = floodCode.scrollHeight;
      count++;
      if (count >= maxLines) {
        clearInterval(interval);
        setTimeout(function() {
          window.location.href = 'home.html';
        }, 350);
      }
    }, 16);
  });
})();
</script>

</body>
</html>
